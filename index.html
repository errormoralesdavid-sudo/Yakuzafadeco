<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Yakuza Fade Co.</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3333">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-search" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
        <symbol id="icon-cart" viewBox="0 0 24 24"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
    </svg>

    <div class="corner-secret corner-tl"></div>
    <div class="corner-secret corner-tr" id="btnAreaAdmin"></div>

    <header id="headerBrandWrapper">
        <div class="header-brand-banner" id="headerBannerBox" style="display:none;">
            <img id="imgHeaderBannerTarget" src="" alt="Banner">
        </div>
        <div class="header-text-container" id="headerTextBox">
            <img src="logoyfc.png" alt="Yakuza Fade Co." id="logoPrincipal" style="max-width: 120px; margin: 0 auto 10px auto; display: block; border-radius: 8px;">
            <div class="subtitulo" id="brandSubHeader"></div>
        </div>
    </header>

    <div class="tasa-bcv-tag pulse-anim" id="tasaDisplayTag">
        <img src="bcv.png" alt="BCV" width="20" height="20" style="vertical-align: middle; margin-right: 6px; border-radius: 50%;"> 
        <span id="tasaText" style="font-size: 13px;">Cargando...</span>
        <img src="bs.png" alt="Bs" width="18" height="18" style="vertical-align: middle; margin-left: 6px;">
    </div>

    <main class="main-wrapper">
        <section class="banner-promo-container" id="bannerTopWrapper" style="display: none;">
            <div class="banner-promo-slides" id="bannerTopSlides"></div>
            <div class="banner-dots" id="bannerTopDots"></div>
        </section>

        <section class="buscador-container">
            <div class="input-wrapper">
                <svg width="18" height="18" class="icon-input"><use href="#icon-search"></use></svg>
                <input type="text" id="inputBuscador" placeholder="Buscar productos...">
            </div>
        </section>

        <nav class="filtros-container" id="contenedorFiltrosCat"></nav>

        <section class="contenedor-tienda" id="listaProductosContainer"></section>

        <section class="banner-promo-container" id="bannerBottomWrapper" style="display: none; margin-top: 10px;">
            <div class="banner-promo-slides" id="bannerBottomSlides"></div>
            <div class="banner-dots" id="bannerBottomDots"></div>
        </section>
    </main>

    <div class="carrito-bolita" id="bolitaCarrito" style="display: none;">
        <svg width="24" height="24"><use href="#icon-cart"></use></svg>
        <div class="carrito-bolita-badge" id="badgeBolitaTotal">0</div>
    </div>

    <!-- Modal Carrito -->
    <div class="modal-overlay" id="modalCarrito">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Resumen de Pedido</h2>
                <button class="btn-cerrar-modal" data-action="close-cart">
                    <svg width="20" height="20"><use href="#icon-close"></use></svg>
                </button>
            </div>
            <div id="listaItemsModal"></div>
            
            <div style="text-align: right; margin-top: 10px;">
                <button id="btnVaciarCarrito" class="btn-vaciar-hover" style="font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--color-acento); background: transparent; color: var(--color-acento); cursor: pointer; display: none;" data-action="empty-cart">
                    <svg width="14" height="14" style="margin-right: 4px;"><use href="#icon-trash"></use></svg> Vaciar todo
                </button>
            </div>
            
            <div class="totales-box">
                <div>Total ($): <span id="modalMontoTotalUSD">$0</span></div>
                <div class="total-bs">Total: <span id="modalMontoTotalBS">0 Bs.</span></div>
            </div>
            
            <div class="modal-label">SELECCIONA MÉTODO DE PAGO:</div>
            <div id="contenedorMetodosPagoModal"></div>
        </div>
    </div>

    <!-- Modal Zoom -->
    <div class="modal-zoom" id="modalZoom">
        <button data-action="close-zoom" style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; width:40px; height:40px; display:flex; justify-content:center; align-items:center; cursor:pointer;">
            <svg width="24" height="24"><use href="#icon-close"></use></svg>
        </button>
        <img id="imgZoomTarget" src="" alt="Zoom Producto">
    </div>
    
    <!-- Modal Admin -->
    <div class="modal-overlay" id="modalAdminPanel" style="display: none; z-index: 4000;"></div>

    <!-- Toast Notification (Reemplazo de los Alert feos) -->
    <div id="toastNotification" class="toast-mensaje">Mensaje</div>

    <footer>
        <div class="corner-secret corner-bl"></div>
        <div class="corner-secret corner-br"></div>
        <p id="footerCopy">Todos los derechos reservados.</p>
        <div class="redes-sociales" id="footerRedes"></div>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
