<!-- PRODUCTO CON CARRUSEL DE FOTOS -->
<div class="producto" data-categoria="ropa" data-nombre="camisa yakuza fade">
    
    <!-- Contenedor del Carrusel -->
    <div class="carrusel-container">
        <div class="carrusel-slides" id="slides-1">
            <img src="URL_FOTO_1.jpg" alt="Foto 1">
            <img src="URL_FOTO_2.jpg" alt="Foto 2">
            <img src="URL_FOTO_3.jpg" alt="Foto 3">
        </div>
        <!-- Botones para cambiar de foto -->
        <button class="carrusel-btn prev" onclick="moverCarrusel('slides-1', -1)">❮</button>
        <button class="carrusel-btn next" onclick="moverCarrusel('slides-1', 1)">❯</button>
    </div>

    <h3>Camisa Yakuza Fade</h3>
    <p>Camisa oficial de alta calidad.</p>
    <div class="precio">$15.00</div>
    
    <!-- Resto de opciones (talla, cantidad y pagos) -->
    <div class="opciones-grid">
        <div class="dropdown-talla">
            <button onclick="toggleDropdown(this)" class="btn-desplegable">Talla: <span class="talla-elegida">M</span> ▾</button>
            <div class="dropdown-content">
                <a href="#" onclick="seleccionarTalla(event, 'S')">Talla S</a>
                <a href="#" onclick="seleccionarTalla(event, 'M')">Talla M</a>
                <a href="#" onclick="seleccionarTalla(event, 'L')">Talla L</a>
                <a href="#" onclick="seleccionarTalla(event, 'XL')">Talla XL</a>
            </div>
        </div>
    </div>

    <div class="cantidad-container">
        <span>Cant:</span>
        <div>
            <button onclick="cambiarCantidad(this, -1)">-</button>
            <span class="contador-val">1</span>
            <button onclick="cambiarCantidad(this, 1)">+</button>
        </div>
    </div>

    <div class="dropdown-pago dropdown">
        <button onclick="toggleDropdown(this)" class="btn-comprar">Comprar ▾</button>
        <div class="dropdown-content">
            <a href="#" onclick="enviarPedido(event, 'Camisa Yakuza Fade', 15, 'Pago Móvil', this)">📱 Pago Móvil</a>
            <a href="#" onclick="enviarPedido(event, 'Camisa Yakuza Fade', 15, 'Transferencia', this)">🏦 Transferencia</a>
            <a href="#" onclick="enviarPedido(event, 'Camisa Yakuza Fade', 15, 'Binance', this)">🪙 Binance</a>
        </div>
    </div>
</div>
