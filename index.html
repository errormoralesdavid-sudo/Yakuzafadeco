<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        /* Contenedor para organizar los productos en fila o columna */
        .contenedor-tienda {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .producto {
            background: white;
            border-radius: 8px;
            padding: 20px;
            width: 280px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        .producto img {
            width: 100%;
            border-radius: 5px;
        }
        .btn-pago {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 8px;
            color: white;
        }
        .btn-whatsapp { background-color: #25D366; }
        .btn-binance { background-color: #F3BA2F; color: black; }
        .btn-pagomovil { background-color: #0070BA; }
    </style>
</head>
<body>

    <h1>Bienvenido a mi Tienda</h1>
    <p>Elige tu producto y selecciona cómo deseas pagar:</p>

    <div class="contenedor-tienda">

        <!-- PRODUCTO 1 -->
        <div class="producto">
            <img src="URL_IMAGEN_1.jpg" alt="Producto 1">
            <h3>Producto 1</h3>
            <p>Descripción corta de este producto.</p>
            <p><strong>Precio: $10.00</strong></p>
            
            <!-- Opciones de pago para este producto -->
            <a href="https://wa.me/TU_NUMERO?text=Hola,%20quiero%20comprar%20Producto%201%20y%20pagar%20por%20Pago%20Móvil" class="btn-pago btn-pagomovil" target="_blank">Pagar con Pago Móvil</a>
            <a href="https://wa.me/TU_NUMERO?text=Hola,%20quiero%20comprar%20Producto%201%20y%20pagar%20por%20Binance" class="btn-pago btn-binance" target="_blank">Pagar con Binance</a>
        </div>

        <!-- PRODUCTO 2 (Puedes copiar y pegar este bloque cuantas veces quieras) -->
        <div class="producto">
            <img src="URL_IMAGEN_2.jpg" alt="Producto 2">
            <h3>Producto 2</h3>
            <p>Descripción corta de este otro producto.</p>
            <p><strong>Precio: $15.00</strong></p>
            
            <a href="https://wa.me/TU_NUMERO?text=Hola,%20quiero%20comprar%20Producto%202%20y%20pagar%20por%20Pago%20Móvil" class="btn-pago btn-pagomovil" target="_blank">Pagar con Pago Móvil</a>
            <a href="https://wa.me/TU_NUMERO?text=Hola,%20quiero%20comprar%20Producto%202%20y%20pagar%20por%20Binance" class="btn-pago btn-binance" target="_blank">Pagar con Binance</a>
        </div>

    </div>

</body>
</html>
