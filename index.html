<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakuza Fade Co. - Tienda Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: #ff3333;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        header p {
            color: #888;
            font-size: 0.95rem;
        }
        /* Contenedor de la Tienda */
        .tienda-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .producto-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .producto-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #f1f1f1;
            text-align: center;
        }
        /* Carrusel de Imágenes */
        .carrusel-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }
        .carrusel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .carrusel-slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: start;
        }
        .precio {
            font-size: 1.2rem;
            color: #4CAF50;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }
        .btn-comprar {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-comprar:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Yakuza Fade Co.</h1>
        <p>Catálogo y Estilo Urbano</p>
    </header>

    <div class="tienda-container">
        
        <!-- ========================================== -->
        <!-- PRODUCTO 1: TU GUÍA VISUAL (Canguro real)  -->
        <!-- ========================================== -->
        <div class="producto-card">
            <h3>Canguro Deportivo</h3>
            
            <div class="carrusel-container">
                <div class="carrusel-slides">
                    <!-- Aquí está tu enlace directo de Catbox -->
                    <img src="https://files.catbox.moe/pm3s1q.jpg" alt="Canguro Deportivo">
                    <!-- Si le quieres agregar más fotos a este producto, solo copia otra línea <img> aquí abajo -->
                </div>
            </div>

            <div class="precio">$7.86</div>
            <a href="https://wa.me/?text=Hola,%20quiero%20comprar%20el%20Canguro%20Deportivo" class="btn-comprar" target="_blank">Pedir por WhatsApp</a>
        </div>

        <!-- ========================================== -->
        <!-- PRODUCTO 2: PLANTILLA PARA NUEVOS ARTÍCULOS-->
        <!-- ========================================== -->
        <div class="producto-card">
            <h3>Nombre de tu Nuevo Producto</h3>
            
            <div class="carrusel-container">
                <div class="carrusel-slides">
                    <!-- Cambia este enlace por el que te dé Catbox para tu siguiente producto -->
                    <img src="https://files.catbox.moe/pm3s1q.jpg" alt="Nuevo Producto">
                </div>
            </div>

            <div class="precio">$0.00</div>
            <a href="#" class="btn-comprar" target="_blank">Pedir por WhatsApp</a>
        </div>

    </div>

</body>
</html>
