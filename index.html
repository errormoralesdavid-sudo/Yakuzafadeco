<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Tienda Oficial</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3333">

    <style>
        :root {
            --color-acento: #ff3333;
            --color-acento-hover: #cc0000;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0b0b;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
            padding-bottom: 90px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Capa oscura sobre la foto de fondo para legibilidad */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 11, 11, 0.88);
            z-index: -1;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* CUADRITOS SECRETOS INTEGRADOS EN EL FLUJO (SE MUEVEN CON EL SCROLL) */
        .corner-secret {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #1e1e1e; /* Gris disimulado */
            opacity: 0.4;
            z-index: 100;
            border-radius: 2px;
            cursor: pointer;
        }
        .corner-tl { top: 8px; left: 8px; }
        .corner-tr { top: 8px; right: 8px; } /* ACTIVA DE ADMIN */
        .corner-bl { bottom: 8px; left: 8px; }
        .corner-br { bottom: 8px; right: 8px; }

        h1 {
            animation: fadeInDown 1s ease-in-out;
            color: var(--color-acento);
            text-shadow: 0px 0px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        .subtitulo {
            animation: fadeInDown 1.2s ease-in-out;
            color: #cccccc;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .buscador-container { margin-bottom: 15px; animation: fadeInDown 1.3s ease-in-out; }
        .buscador-container input {
            width: 90%; max-width: 400px; padding: 10px; border-radius: 20px;
            border: 1px solid #333; background: #161616; color: white;
            font-size: 14px; outline: none; text-align: center; transition: 0.3s;
        }
        .buscador-container input:focus { border-color: var(--color-acento); }

        .filtros-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; animation: fadeInDown 1.4s ease-in-out; }
        .btn-filtro { background: #1a1a1a; color: white; border: 1px solid #333; padding: 6px 14px; border-radius: 15px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .btn-filtro:hover, .btn-filtro.activo { background: var(--color-acento); border-color: var(--color-acento); }

        .contenedor-tienda { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 700px; margin: 0 auto; }
        @media (max-width: 600px) { .contenedor-tienda { grid-template-columns: 1fr; } }

        .producto {
            background: rgba(22, 22, 22, 0.95); border: 1px solid #282828; border-radius: 12px; padding: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5); text-align: left; animation: fadeInUp 0.8s ease-in-out;
            position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
        }

        .badge-combo {
            position: absolute; top: 15px; left: 15px; background: var(--color-acento); color: white;
            font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; z-index: 10;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.5);
        }

        .stock-indicator { font-size: 11px; color: #4cd137; margin-bottom: 6px; font-weight: bold; }
        .stock-indicator.agotado { color: var(--color-acento); }

        .carrusel-container { position: relative; width: 100%; height: 160px; overflow: hidden; border-radius: 8px; background: #222; touch-action: pan-y; }
        .carrusel-slides { display: flex; width: 100%; height: 100%; transition: transform 0.3s ease-in-out; }
        .carrusel-slides img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; cursor: zoom-in; }
        
        .carrusel-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.6);
            color: white; border: none; padding: 5px 8px; cursor: pointer; font-size: 12px; border-radius: 4px; z-index: 2;
        }
        .carrusel-btn.prev { left: 5px; } .carrusel-btn.next { right: 5px; }

        .producto h3 { font-size: 15px; margin: 8px 0 4px 0; color: #fff; }
        .producto p { font-size: 12px; color: #aaa; margin: 0 0 8px 0; }
        .precio { font-weight: bold; color: #4cd137; font-size: 15px; margin-bottom: 8px; }

        .opciones-grid { display: flex; gap: 5px; margin-bottom: 8px; }
        .dropdown-contenedor { position: relative; flex: 1; width: 100%; }
        .btn-desplegable { background-color: #222; color: white; border: 1px solid #333; width: 100%; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .dropdown-content { display: none; position: absolute; bottom: 100%; left: 0; background-color: #1a1a1a; width: 100%; z-index: 99; border-radius: 6px; overflow: hidden; margin-bottom: 4px; border: 1px solid #444; }
        .dropdown-content a { color: white; padding: 9px; text-decoration: none; display: block; font-size: 11px; text-align: left; border-bottom: 1px solid #282828; }
        .dropdown-content a:hover { background-color: var(--color-acento); }
        .show { display: block !important; }

        .cantidad-container { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; border: 1px solid #333; }
        .cantidad-container button { background: #333; color: white; border: none; padding: 3px 9px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        .btn-agregar-carrito { background-color: var(--color-acento); color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; transition: 0.2s; }
        .btn-agregar-carrito:hover { filter: brightness(0.9); }

        /* PANEL ADMIN */
        .admin-panel-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 3000; justify-content: center; align-items: center; }
        .admin-box { background: #141414; border: 1px solid var(--color-acento); padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; text-align: left; }
        .admin-box h2 { color: var(--color-acento); margin-top: 0; font-size: 18px; text-align: center; border-bottom: 1px dashed #333; padding-bottom: 8px; }
        .admin-box label { font-size: 11px; color: var(--color-acento); font-weight: bold; margin-top: 8px; display: block; }
        .admin-box input, .admin-box select { width: 100%; background: #0b0b0b; border: 1px solid #333; padding: 8px; border-radius: 6px; color: #fff; margin-top: 3px; margin-bottom: 8px; box-sizing: border-box; font-size: 12px; }
        .btn-admin-act { background: var(--color-acento); color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 6px; transition: 0.2s; }
        
        .admin-card-item { background: #1e1e1e; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        /* CARRITO FLOTANTE Y MODALES */
        .carrito-flotante { position: fixed; bottom: 0; left: 0; width: 100%; background: #141414; border-top: 2px solid var(--color-acento); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-sizing: border-box; }
        .modal-carrito { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal-contenido { background: #141414; padding: 22px; border-radius: 14px; width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; border: 1px solid #333; text-align: left; }

        /* MODAL ZOOM */
        .modal-zoom { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 4000; justify-content: center; align-items: center; }
        .modal-zoom img { max-width: 92%; max-height: 85vh; border-radius: 8px; border: 2px solid var(--color-acento); }

        /* FOOTER */
        footer { margin-top: 30px; padding: 20px 10px; border-top: 1px solid #1a1a1a; position: relative; }
        .redes-sociales { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .redes-sociales a { background: #161616; color: #ccc; padding: 7px 14px; border-radius: 6px; text-decoration: none; font-size: 11px; border: 1px solid #282828; transition: 0.3s; }
        .redes-sociales a:hover { background: var(--color-acento); color: white; border-color: var(--color-acento); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, initializeFirestore, persistentLocalCache } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsBnD8C_E_o5oHzmw7bWmKrmW2JAjdcaU",
            authDomain: "geomercado-9d642.firebaseapp.com",
            projectId: "geomercado-9d642",
            storageBucket: "geomercado-9d642.firebasestorage.app",
            messagingSenderId: "521126834575",
            appId: "1:521126834575:web:4c847dec3dd57d9a439bfa"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { localCache: persistentLocalCache() });

        window.guardarEnNubeYakuza = async function() {
            try {
                await setDoc(doc(db, "yakuza_store", "catalogo_productos"), {
                    nombreEmpresa: window.nombreEmpresa || "Yakuza Fade Co.",
                    colorAcento: window.colorAcento || "#ff3333",
                    fondoUrl: window.fondoUrl || "",
                    categorias: window.categoriasTienda || ["Combos", "Ropa", "Medias", "Barbería"],
                    productos: window.listaProductosYakuza || [],
                    redes: window.redesEmpresa || {}
                });
            } catch(e) { console.warn("Guardado offline."); }
        };

        onSnapshot(doc(db, "yakuza_store", "catalogo_productos"), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                if (data.nombreEmpresa) window.nombreEmpresa = data.nombreEmpresa;
                if (data.colorAcento) window.colorAcento = data.colorAcento;
                if (data.fondoUrl !== undefined) window.fondoUrl = data.fondoUrl;
                if (data.categorias) window.categoriasTienda = data.categorias;
                if (data.productos) window.listaProductosYakuza = data.productos;
                if (data.redes) window.redesEmpresa = data.redes;
                window.renderizarPaginaCompleta();
            }
        });
    </script>
</head>
<body>

    <!-- 4 ESQUINAS SECRETAS QUE SE MUEVEN CON EL SCROLL -->
    <div class="corner-secret corner-tl"></div>
    <div class="corner-secret corner-tr" onclick="window.solicitarAccesoAdmin()"></div> <!-- ACTIVA -->

    <h1 id="brandHeader">Yakuza Fade Co.</h1>
    <div class="subtitulo">Barbería, Ropa Oficial & Combos Urbanos</div>

    <div class="buscador-container">
        <input type="text" id="inputBuscador" placeholder="🔍 Buscar productos..." onkeyup="window.filtrarProductos()">
    </div>

    <!-- BOTONES DE CATEGORÍAS DINÁMICAS -->
    <div class="filtros-container" id="contenedorFiltrosCat"></div>

    <div class="contenedor-tienda" id="listaProductosContainer"></div>

    <!-- BARRA FLOTANTE CARRITO -->
    <div class="carrito-flotante" id="barraCarrito" style="display: none;">
        <div style="font-size:13px; font-weight:bold; color:#ddd;">
            🛒 Carrito: <span id="contadorCarritoTotal">0</span> prod. | <span id="montoTotalCarrito" style="color: #4cd137; font-size:15px;">$0</span>
        </div>
        <button style="background:var(--color-acento); color:#fff; border:none; padding:8px 18px; border-radius:20px; font-weight:bold; cursor:pointer;" onclick="window.abrirModalCarrito()">Ver Pedido</button>
    </div>

    <!-- MODAL RESUMEN COMPRA -->
    <div class="modal-carrito" id="modalCarrito">
        <div class="modal-contenido">
            <h2 style="color:var(--color-acento); text-align:center;">🧾 Resumen de Pedido</h2>
            <div id="listaItemsModal"></div>
            <div style="font-size: 16px; font-weight: bold; text-align: right; margin: 15px 0; color: #4cd137; background: #111; padding: 8px; border-radius: 6px;">
                Total a Pagar: $<span id="modalMontoTotal">0</span>
            </div>
            
            <div style="font-size:11px; color:#aaa; margin-bottom:6px;">SELECCIONA MÉTODO DE PAGO:</div>
            <button style="background:#25d366; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:bold; width:100%; margin-bottom:6px; cursor:pointer;" onclick="window.enviarPedidoWhatsApp('Pago Móvil')">📱 Pagar con Pago Móvil</button>
            <button style="background:#25d366; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:bold; width:100%; margin-bottom:6px; cursor:pointer;" onclick="window.enviarPedidoWhatsApp('Binance P2P')">🪙 Pagar con Binance</button>

            <button style="background:#222; color:#aaa; border:1px solid #444; padding:8px; border-radius:8px; width:100%; margin-top:10px; cursor:pointer;" onclick="document.getElementById('modalCarrito').style.display='none'">Seguir Comprando</button>
        </div>
    </div>

    <!-- MODAL ZOOM IMAGEN -->
    <div class="modal-zoom" id="modalZoom" onclick="this.style.display='none'">
        <img id="imgZoomTarget" src="" alt="Zoom Producto">
    </div>

    <!-- PANEL ADMIN OCULTO -->
    <div class="admin-panel-overlay" id="modalAdminPanel">
        <div class="admin-box">
            <h2>⚙️ Panel Admin - Configuración</h2>
            
            <label>🏷️ Nombre de la Empresa / Página:</label>
            <input type="text" id="admin-empresa-nombre" placeholder="Ej. Yakuza Fade Co.">

            <label>🎨 Color del Tema / Detalles de la Página:</label>
            <input type="color" id="admin-color-acento" value="#ff3333" style="height:40px; cursor:pointer;">

            <label>🖼️ URL Foto de Fondo (Opcional):</label>
            <input type="text" id="admin-fondo-url" placeholder="Ej. https://misitio.com/fondo.jpg">

            <label>📂 Categorías de Productos (Separadas por coma):</label>
            <input type="text" id="admin-categorias-lista" placeholder="Ej. Combos, Ropa, Medias, Barbería, Accesorios">

            <label>📱 Redes Sociales (URLs / Teléfono exacto):</label>
            <input type="text" id="adm-red-wsp" placeholder="WhatsApp (Ej. 584123167126)">
            <input type="text" id="adm-red-ig" placeholder="Instagram (URL completa)">
            <input type="text" id="adm-red-tk" placeholder="TikTok (URL completa)">
            <input type="text" id="adm-red-fb" placeholder="Facebook (URL completa)">
            <input type="text" id="adm-red-yt" placeholder="YouTube (URL completa)">

            <hr style="border-top:1px dashed #333; margin:12px 0;">

            <h4 style="color:#fff; margin:4px 0 8px 0; font-size:13px;" id="titulo-form-admin">➕ Agregar / Editar Producto</h4>
            
            <input type="text" id="adm-p-nombre" placeholder="Nombre Producto">
            <input type="text" id="adm-p-desc" placeholder="Descripción corta">
            <input type="number" step="0.01" id="adm-p-precio" placeholder="Precio ($)">
            <input type="number" id="adm-p-stock" placeholder="Stock disponible">

            <label>Seleccionar Categoría:</label>
            <select id="adm-p-cat"></select>

            <input type="text" id="adm-p-badge" placeholder="Etiqueta Especial (Ej. ¡AHORRA 20%!)">
            <input type="text" id="adm-p-tallas" placeholder="Tallas separadas por coma (S, M, L)">
            <input type="text" id="adm-p-colores" placeholder="Colores separados por coma (Negro, Blanco)">
            
            <label style="color:#aaa;">🖼️ URLs de Imágenes (Casillas individuales):</label>
            <input type="text" id="adm-p-img1" placeholder="URL Imagen Principal (1)">
            <input type="text" id="adm-p-img2" placeholder="URL Imagen Secundaria (2)">
            <input type="text" id="adm-p-img3" placeholder="URL Imagen 3">

            <button class="btn-admin-act" onclick="window.guardarProductoAdmin()">Guardar Cambios en Catálogo</button>
            <button class="btn-admin-act" style="background:#333; color:#aaa; margin-bottom:12px;" onclick="window.limpiarFormAdmin()">Limpiar Formulario</button>

            <h4 style="color:var(--color-acento); margin:12px 0 6px 0; font-size:13px;">📦 Productos Existentes</h4>
            <div id="adminTarjetasProductos"></div>

            <button class="btn-admin-act" style="background:#222; color:#fff;" onclick="window.cerrarAdminPanel()">Cerrar Panel</button>
        </div>
    </div>

    <footer>
        <!-- ESQUINAS INFERIORES QUE DIBUJAN EL CIERRE DEL DOCUMENTO -->
        <div class="corner-secret corner-bl"></div>
        <div class="corner-secret corner-br"></div>

        <p id="footerCopy">Todos los derechos reservados.</p>
        <div class="redes-sociales" id="footerRedes"></div>
    </footer>

    <script>
        var carrito = [];
        var listaProductosYakuza = [];
        var nombreEmpresa = "Yakuza Fade Co.";
        var colorAcento = "#ff3333";
        var fondoUrl = "";
        var categoriasTienda = ["Combos", "Ropa", "Medias", "Barbería"];
        var redesEmpresa = { wsp: "584123167126", ig: "", tk: "", fb: "", yt: "" };
        var idProductoEdicion = null;
        var indicesCarrusel = {};

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function(){});
            });
        }

        window.solicitarAccesoAdmin = function() {
            var clave = prompt("🔐 Clave Administrador:");
            if(clave === "612003" || clave === "yakuza") {
                document.getElementById('admin-empresa-nombre').value = nombreEmpresa;
                document.getElementById('admin-color-acento').value = colorAcento;
                document.getElementById('admin-fondo-url').value = fondoUrl;
                document.getElementById('admin-categorias-lista').value = categoriasTienda.join(', ');
                
                document.getElementById('adm-red-wsp').value = redesEmpresa.wsp || "";
                document.getElementById('adm-red-ig').value = redesEmpresa.ig || "";
                document.getElementById('adm-red-tk').value = redesEmpresa.tk || "";
                document.getElementById('adm-red-fb').value = redesEmpresa.fb || "";
                document.getElementById('adm-red-yt').value = redesEmpresa.yt || "";
                
                window.actualizarSelectCategoriasAdmin();
                window.renderizarTarjetasAdmin();
                document.getElementById('modalAdminPanel').style.display = 'flex';
            } else if(clave) {
                alert("Clave incorrecta.");
            }
        };

        window.cerrarAdminPanel = function() {
            document.getElementById('modalAdminPanel').style.display = 'none';
            window.limpiarFormAdmin();
        };

        window.limpiarFormAdmin = function() {
            idProductoEdicion = null;
            document.getElementById('titulo-form-admin').innerText = "➕ Agregar / Editar Producto";
            document.getElementById('adm-p-nombre').value = "";
            document.getElementById('adm-p-desc').value = "";
            document.getElementById('adm-p-precio').value = "";
            document.getElementById('adm-p-stock').value = "";
            document.getElementById('adm-p-badge').value = "";
            document.getElementById('adm-p-tallas').value = "";
            document.getElementById('adm-p-colores').value = "";
            document.getElementById('adm-p-img1').value = "";
            document.getElementById('adm-p-img2').value = "";
            document.getElementById('adm-p-img3').value = "";
        };

        window.actualizarSelectCategoriasAdmin = function() {
            var sel = document.getElementById('adm-p-cat');
            if(!sel) return;
            sel.innerHTML = categoriasTienda.map(c => `<option value="${c.toLowerCase().trim()}">${c.trim()}</option>`).join('');
        };

        window.guardarProductoAdmin = function() {
            nombreEmpresa = document.getElementById('admin-empresa-nombre').value.trim() || "Yakuza Fade Co.";
            colorAcento = document.getElementById('admin-color-acento').value || "#ff3333";
            fondoUrl = document.getElementById('admin-fondo-url').value.trim();

            var catsInput = document.getElementById('admin-categorias-lista').value.trim();
            if(catsInput) {
                categoriasTienda = catsInput.split(',').map(c => c.trim()).filter(c => c.length > 0);
            }

            redesEmpresa = {
                wsp: document.getElementById('adm-red-wsp').value.trim(),
                ig: document.getElementById('adm-red-ig').value.trim(),
                tk: document.getElementById('adm-red-tk').value.trim(),
                fb: document.getElementById('adm-red-fb').value.trim(),
                yt: document.getElementById('adm-red-yt').value.trim()
            };

            var nom = document.getElementById('adm-p-nombre').value.trim();
            var desc = document.getElementById('adm-p-desc').value.trim();
            var precio = parseFloat(document.getElementById('adm-p-precio').value) || 0;
            var stock = parseInt(document.getElementById('adm-p-stock').value) || 0;
            var cat = document.getElementById('adm-p-cat').value;
            var badge = document.getElementById('adm-p-badge').value.trim();
            var tallasStr = document.getElementById('adm-p-tallas').value.trim();
            var coloresStr = document.getElementById('adm-p-colores').value.trim();

            var img1 = document.getElementById('adm-p-img1').value.trim();
            var img2 = document.getElementById('adm-p-img2').value.trim();
            var img3 = document.getElementById('adm-p-img3').value.trim();

            if(nom && precio > 0) {
                var tallas = tallasStr ? tallasStr.split(',').map(s=>s.trim()) : ["Única"];
                var colores = coloresStr ? coloresStr.split(',').map(s=>s.trim()) : ["Estándar"];
                var imgs = [];
                if(img1) imgs.push(img1);
                if(img2) imgs.push(img2);
                if(img3) imgs.push(img3);
                if(imgs.length === 0) imgs.push("https://files.catbox.moe/8j9706.jpg");

                if(idProductoEdicion !== null) {
                    for(var i=0; i<listaProductosYakuza.length; i++) {
                        if(listaProductosYakuza[i].id === idProductoEdicion) {
                            listaProductosYakuza[i] = { id: idProductoEdicion, nombre: nom, desc: desc, precio: precio, stock: stock, categoria: cat, badge: badge, tallas: tallas, colores: colores, imgs: imgs };
                            break;
                        }
                    }
                } else {
                    listaProductosYakuza.push({ id: Date.now(), nombre: nom, desc: desc, precio: precio, stock: stock, categoria: cat, badge: badge, tallas: tallas, colores: colores, imgs: imgs });
                }
            }

            if(typeof window.guardarEnNubeYakuza === 'function') window.guardarEnNubeYakuza();
            window.renderizarPaginaCompleta();
            window.limpiarFormAdmin();
            window.renderizarTarjetasAdmin();
            alert("✓ Cambios guardados en la tienda.");
        };

        window.renderizarTarjetasAdmin = function() {
            var cont = document.getElementById('adminTarjetasProductos');
            if(!cont) return;
            var html = "";
            listaProductosYakuza.forEach(p => {
                html += `
                    <div class="admin-card-item">
                        <div>
                            <strong style="color:#fff; font-size:12px;">${p.nombre}</strong><br>
                            <span style="color:#4cd137; font-size:11px;">$${p.precio.toFixed(2)} | Stock: ${p.stock}</span>
                        </div>
                        <div>
                            <button style="background:var(--color-acento); color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;" onclick="window.cargarProductoParaEditar(${p.id})">✏️ Editar</button>
                            <button style="background:#333; color:#ff3333; border:1px solid #444; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;" onclick="window.eliminarProductoAdmin(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            cont.innerHTML = html || '<div style="color:#aaa; font-size:11px;">No hay productos registrados.</div>';
        };

        window.cargarProductoParaEditar = function(id) {
            var p = listaProductosYakuza.find(x => x.id === id);
            if(!p) return;
            idProductoEdicion = p.id;
            document.getElementById('titulo-form-admin').innerText = "✏️ Editando: " + p.nombre;
            document.getElementById('adm-p-nombre').value = p.nombre;
            document.getElementById('adm-p-desc').value = p.desc;
            document.getElementById('adm-p-precio').value = p.precio;
            document.getElementById('adm-p-stock').value = p.stock;
            document.getElementById('adm-p-cat').value = p.categoria;
            document.getElementById('adm-p-badge').value = p.badge || "";
            document.getElementById('adm-p-tallas').value = p.tallas ? p.tallas.join(', ') : "";
            document.getElementById('adm-p-colores').value = p.colores ? p.colores.join(', ') : "";
            document.getElementById('adm-p-img1').value = p.imgs[0] || "";
            document.getElementById('adm-p-img2').value = p.imgs[1] || "";
            document.getElementById('adm-p-img3').value = p.imgs[2] || "";
        };

        window.eliminarProductoAdmin = function(id) {
            if(confirm("¿Eliminar este producto?")) {
                listaProductosYakuza = listaProductosYakuza.filter(x => x.id !== id);
                if(typeof window.guardarEnNubeYakuza === 'function') window.guardarEnNubeYakuza();
                window.renderizarPaginaCompleta();
                window.renderizarTarjetasAdmin();
            }
        };

        window.renderizarPaginaCompleta = function() {
            document.documentElement.style.setProperty('--color-acento', colorAcento);
            document.body.style.backgroundImage = fondoUrl ? `url('${fondoUrl}')` : 'none';

            document.getElementById('brandHeader').innerText = nombreEmpresa;
            document.getElementById('pageTitle').innerText = nombreEmpresa + " - Tienda Oficial";
            document.getElementById('footerCopy').innerText = nombreEmpresa + ". Todos los derechos reservados.";

            /* RENDERIZAR BOTONES DE FILTRO CATEGORÍAS */
            var filtrosContainer = document.getElementById('contenedorFiltrosCat');
            var btnFiltrosHtml = `<button class="btn-filtro activo" onclick="window.filtrarCategoria('todos', event)">Todos</button>`;
            categoriasTienda.forEach(c => {
                btnFiltrosHtml += `<button class="btn-filtro" onclick="window.filtrarCategoria('${c.toLowerCase().trim()}', event)">${c.trim()}</button>`;
            });
            filtrosContainer.innerHTML = btnFiltrosHtml;

            /* REDES SOCIALES FOOTER */
            var redHtml = "";
            if(redesEmpresa.wsp) redHtml += `<a href="https://wa.me/${redesEmpresa.wsp}" target="_blank">💬 WhatsApp</a>`;
            if(redesEmpresa.ig) redHtml += `<a href="${redesEmpresa.ig}" target="_blank">📸 Instagram</a>`;
            if(redesEmpresa.tk) redHtml += `<a href="${redesEmpresa.tk}" target="_blank">🎵 TikTok</a>`;
            if(redesEmpresa.fb) redHtml += `<a href="${redesEmpresa.fb}" target="_blank">📘 Facebook</a>`;
            if(redesEmpresa.yt) redHtml += `<a href="${redesEmpresa.yt}" target="_blank">▶️ YouTube</a>`;
            document.getElementById('footerRedes').innerHTML = redHtml;

            window.renderizarProductosTienda();
        };

        window.renderizarProductosTienda = function() {
            var container = document.getElementById('listaProductosContainer');
            if(!container) return;
            var html = "";

            if(listaProductosYakuza.length === 0) {
                container.innerHTML = '<div style="color:#aaa; font-size:13px; grid-column:1/-1;">No hay productos disponibles en el catálogo.</div>';
                return;
            }

            listaProductosYakuza.forEach(function(p) {
                var badgeHtml = p.badge ? '<div class="badge-combo">' + p.badge + '</div>' : '';
                var slidesHtml = p.imgs.map(img => `<img src="${img}" alt="Producto" onclick="window.abrirZoomImage('${img}')">`).join('');
                
                var tallasOpt = p.tallas.map(t => '<a href="#" onclick="window.seleccionarOpcion(event, this, \'' + t + '\')">' + t + '</a>').join('');
                var coloresOpt = p.colores.map(c => '<a href="#" onclick="window.seleccionarOpcion(event, this, \'' + c + '\')">' + c + '</a>').join('');

                html += `
                    <div class="producto" data-categoria="${p.categoria.toLowerCase().trim()}" data-nombre="${p.nombre.toLowerCase()}">
                        ${badgeHtml}
                        <div class="carrusel-container" id="carrusel-box-${p.id}">
                            <div class="carrusel-slides" id="slides-${p.id}">
                                ${slidesHtml}
                            </div>
                            <button class="carrusel-btn prev" onclick="window.moverCarrusel('slides-${p.id}', -1)">❮</button>
                            <button class="carrusel-btn next" onclick="window.moverCarrusel('slides-${p.id}', 1)">❯</button>
                        </div>
                        
                        <div class="stock-indicator ${p.stock < 1 ? 'agotado' : ''}">
                            📦 Stock: <span>${p.stock}</span> unids.
                        </div>

                        <h3>${p.nombre}</h3>
                        <p>${p.desc}</p>
                        <div class="precio">$${p.precio.toFixed(2)}</div>
                        
                        <div class="opciones-grid">
                            <div class="dropdown-contenedor">
                                <button type="button" onclick="window.toggleDropdown(event, this)" class="btn-desplegable">Talla: <span class="talla-elegida">${p.tallas[0]}</span> ▾</button>
                                <div class="dropdown-content">${tallasOpt}</div>
                            </div>
                            <div class="dropdown-contenedor">
                                <button type="button" onclick="window.toggleDropdown(event, this)" class="btn-desplegable">Color: <span class="color-elegido">${p.colores[0]}</span> ▾</button>
                                <div class="dropdown-content">${coloresOpt}</div>
                            </div>
                        </div>

                        <div class="cantidad-container">
                            <span>Cant:</span>
                            <div>
                                <button type="button" onclick="window.cambiarCantidad(this, -1)">-</button>
                                <span class="contador-val">1</span>
                                <button type="button" onclick="window.cambiarCantidad(this, 1)">+</button>
                            </div>
                        </div>

                        <button type="button" class="btn-agregar-carrito" onclick="window.agregarAlCarrito(event, this, ${p.id})">🛒 Añadir al Carrito</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            window.activarSwipeCarruseles();
        };

        window.abrirZoomImage = function(src) {
            document.getElementById('imgZoomTarget').src = src;
            document.getElementById('modalZoom').style.display = 'flex';
        };

        window.activarSwipeCarruseles = function() {
            listaProductosYakuza.forEach(p => {
                var box = document.getElementById(`carrusel-box-${p.id}`);
                if(!box) return;
                var startX = 0;
                box.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
                box.addEventListener('touchend', e => {
                    var endX = e.changedTouches[0].clientX;
                    if(startX - endX > 40) window.moverCarrusel(`slides-${p.id}`, 1);
                    else if(endX - startX > 40) window.moverCarrusel(`slides-${p.id}`, -1);
                }, {passive: true});
            });
        };

        window.moverCarrusel = function(idCarrusel, dir) {
            if (!indicesCarrusel[idCarrusel]) indicesCarrusel[idCarrusel] = 0;
            var el = document.getElementById(idCarrusel);
            if(!el) return;
            var total = el.children.length;
            indicesCarrusel[idCarrusel] += dir;
            if(indicesCarrusel[idCarrusel] >= total) indicesCarrusel[idCarrusel] = 0;
            if(indicesCarrusel[idCarrusel] < 0) indicesCarrusel[idCarrusel] = total - 1;
            el.style.transform = `translateX(${-indicesCarrusel[idCarrusel] * 100}%)`;
        };

        window.toggleDropdown = function(e, btn) {
            e.stopPropagation();
            var menu = btn.nextElementSibling;
            document.querySelectorAll('.dropdown-content').forEach(c => { if(c!==menu) c.classList.remove('show'); });
            menu.classList.toggle('show');
        };

        window.seleccionarOpcion = function(e, a, val) {
            e.preventDefault();
            var parent = a.closest('.dropdown-contenedor');
            var span = parent.querySelector('.talla-elegida') || parent.querySelector('.color-elegido');
            if(span) span.innerText = val;
            parent.querySelector('.dropdown-content').classList.remove('show');
        };

        window.cambiarCantidad = function(btn, dir) {
            var span = btn.parentNode.querySelector('.contador-val');
            var cant = parseInt(span.innerText) + dir;
            if(cant < 1) cant = 1;
            span.innerText = cant;
        };

        window.agregarAlCarrito = function(e, btn, idProd) {
            var prodObj = listaProductosYakuza.find(p => p.id === idProd);
            if(!prodObj) return;

            var tarjeta = btn.closest('.producto');
            var cant = parseInt(tarjeta.querySelector('.contador-val').innerText);
            var talla = tarjeta.querySelector('.talla-elegida') ? tarjeta.querySelector('.talla-elegida').innerText : "Única";
            var color = tarjeta.querySelector('.color-elegido') ? tarjeta.querySelector('.color-elegido').innerText : "Estándar";

            var varStr = `Talla: ${talla} | Color: ${color}`;
            var existente = carrito.find(i => i.id === idProd && i.variacion === varStr);

            if(existente) existente.cantidad += cant;
            else carrito.push({ id: idProd, nombre: prodObj.nombre, precio: prodObj.precio, cantidad: cant, variacion: varStr });

            window.actualizarBarraCarrito();
            btn.innerText = "¡Agregado! ✓";
            btn.style.background = "#4cd137";
            setTimeout(() => { btn.innerText = "🛒 Añadir al Carrito"; btn.style.background = "var(--color-acento)"; }, 1000);
        };

        window.actualizarBarraCarrito = function() {
            var totalItems = 0; var totalMonto = 0;
            carrito.forEach(i => { totalItems += i.cantidad; totalMonto += (i.precio * i.cantidad); });
            
            document.getElementById('contadorCarritoTotal').innerText = totalItems;
            document.getElementById('montoTotalCarrito').innerText = "$" + totalMonto.toFixed(2);
            document.getElementById('modalMontoTotal').innerText = totalMonto.toFixed(2);
            document.getElementById('barraCarrito').style.display = totalItems > 0 ? 'flex' : 'none';
        };

        window.abrirModalCarrito = function() {
            var cont = document.getElementById('listaItemsModal');
            var html = "";
            carrito.forEach((i, idx) => {
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; padding:8px 0; font-size:12px;">
                        <div>
                            <strong style="color:#fff;">${i.nombre}</strong><br>
                            <small style="color:#aaa;">${i.variacion} | Cant: ${i.cantidad}</small><br>
                            <span style="color:#4cd137; font-weight:bold;">$${(i.precio*i.cantidad).toFixed(2)}</span>
                        </div>
                        <button style="background:var(--color-acento); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="window.eliminarDelCarrito(${idx})">✕</button>
                    </div>
                `;
            });
            cont.innerHTML = html || '<p style="color:#aaa; text-align:center;">Carrito vacío.</p>';
            document.getElementById('modalCarrito').style.display = 'flex';
        };

        window.eliminarDelCarrito = function(idx) {
            carrito.splice(idx, 1);
            window.actualizarBarraCarrito();
            window.abrirModalCarrito();
        };

        window.enviarPedidoWhatsApp = function(metodo) {
            if(carrito.length === 0) return;
            var msj = "🔥 *" + nombreEmpresa.toUpperCase() + " - NUEVO PEDIDO* 🔥\n\n";
            var total = 0;
            carrito.forEach(i => {
                var sub = i.precio * i.cantidad;
                total += sub;
                msj += `▪️ *${i.nombre}*\n   ${i.variacion} | Cant: ${i.cantidad} x $${i.precio.toFixed(2)} = $${sub.toFixed(2)}\n\n`;
            });
            msj += `💵 *TOTAL A PAGAR: $${total.toFixed(2)}*\n💳 *Método de pago:* ${metodo}`;
            var url = `https://wa.me/${redesEmpresa.wsp}?text=${encodeURIComponent(msj)}`;
            window.open(url, '_blank');
        };

        window.filtrarCategoria = function(cat, e) {
            document.querySelectorAll('.btn-filtro').forEach(b=>b.classList.remove('activo'));
            e.target.classList.add('activo');
            document.querySelectorAll('.producto').forEach(p => {
                p.style.display = (cat==='todos' || p.dataset.categoria===cat) ? 'flex' : 'none';
            });
        };

        window.filtrarProductos = function() {
            var txt = document.getElementById('inputBuscador').value.toLowerCase();
            document.querySelectorAll('.producto').forEach(p => {
                p.style.display = p.dataset.nombre.includes(txt) ? 'flex' : 'none';
            });
        };

        window.onclick = function(e) {
            if(!e.target.matches('.btn-desplegable')) {
                document.querySelectorAll('.dropdown-content').forEach(c=>c.classList.remove('show'));
            }
        };
    </script>
</body>
</html>
